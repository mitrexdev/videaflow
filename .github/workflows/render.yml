name: Render image

on:
  push:
    branches: [main]
    paths: ["services/render/**", "packages/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push render
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/render/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/render:latest
            ghcr.io/${{ github.repository }}/render:${{ github.sha }}
