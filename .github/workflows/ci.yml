name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (api + worker + orchestrator)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: videaflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/videaflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ai -e services/api -e services/worker
      - name: Import smoke test
        working-directory: services/api
        run: |
          python -c "from app.main import app; print('api OK')"
          python -c "from orchestrator.routing.router import create_default_router; create_default_router(); print('orchestrator OK')"
          python -c "from app.celery_app import celery_app; print('celery OK')"
      - name: Migrations apply cleanly
        working-directory: services/api
        run: alembic upgrade head
      - name: Tests (placeholder — no tests written yet)
        working-directory: services/api
        continue-on-error: true
        run: python -m pytest -q

  typescript:
    name: TypeScript (web + packages + render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Typecheck all workspaces
        run: pnpm -r --if-present typecheck
      - name: Build web
        run: pnpm --filter @videaflow/web build
