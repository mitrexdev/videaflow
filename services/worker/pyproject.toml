[project]
name = "videaflow-worker"
version = "0.1.0"
description = "Videaflow background workers (Celery)"
requires-python = ">=3.11"
dependencies = [
  "celery[redis]>=5.4.0",
  "redis>=5.0.8",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "videaflow-orchestrator",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
