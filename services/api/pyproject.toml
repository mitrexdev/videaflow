[project]
name = "videaflow-api"
version = "0.1.0"
description = "Videaflow backend API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.29.0",
  "alembic>=1.13.2",
  "redis>=5.0.8",
  "celery[redis]>=5.4.0",
  "httpx>=0.27.0",
  "svix>=1.30.0",
  "pyjwt>=2.9.0",
  "cryptography>=43.0.0",
  "videaflow-orchestrator",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
